<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>療育・習い事マップ 千代田・台東・中央</title>
<meta name="description" content="千代田区・台東区・中央区の児童発達支援・放課後等デイサービス、子どもの発達障害を診る医療機関、発達特性に配慮した習い事を地図で探せるマップ。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f3; --surface:#ffffff; --ink:#2b2a28; --muted:#6f6a62; --line:#e7e1d7;
  --jihatsu:#e8833a; --houday:#2f7fc1; --both:#8a5cc2; --houmon:#3a9a6a; --hoiku:#c2527a; --clinic:#d64545; --lesson:#14937f;
  --shadow:0 8px 24px rgba(40,30,10,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --surface:#262522; --ink:#f1ede6; --muted:#aaa397; --line:#3a3833;
    --shadow:0 8px 24px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}
header{padding:10px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);z-index:1000}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;margin:0;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
h1 small{font-size:12px;color:var(--muted);margin-left:6px;font-weight:500}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .dot.sq{border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.selects{display:flex;gap:6px;margin-top:6px}
.selects label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.selects select{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 6px}
.selects select.on{border-color:var(--ink)}
.selects.school{margin-top:5px}
.seg{display:flex;margin-top:8px;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--surface);color:var(--ink);font:inherit;font-size:12.5px;font-weight:700;padding:6px 4px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:5px}
.seg button+button{border-left:1.5px solid var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.seg .dot{width:9px;height:9px;border-radius:50%}
.chips-label{font-size:10.5px;color:var(--muted);flex:0 0 auto;align-self:center;font-weight:700}
.fbox{flex:1;min-width:0;border-radius:10px;padding:3px 4px 3px 7px;display:flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700}
.fbox select{flex:1;min-width:0;font:inherit;font-weight:500;font-size:12.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:4px 5px}
.fbox select.on{border-color:var(--ink)}
.fbox.ryo{background:color-mix(in srgb,var(--jihatsu) 16%,var(--bg));color:color-mix(in srgb,var(--jihatsu) 70%,var(--ink))}
.fbox.les{background:color-mix(in srgb,var(--lesson) 16%,var(--bg));color:color-mix(in srgb,var(--lesson) 70%,var(--ink))}
[hidden]{display:none!important}
.selects.school label{flex:1}
.school-note{font-size:10.5px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.school-note b{color:var(--ink)}
.spin{width:18px;height:18px;border-radius:5px;background:#fff;border:2px solid #555;color:#333;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);font-family:"Zen Maru Gothic",sans-serif}
.spin.j{border-color:#7a6a55}
.spin.p{border-color:#8a5cc2;color:#6b3fa0;border-style:double;border-width:3px}
.dlegend{display:block;font-size:10.5px;color:var(--muted);font-weight:400;margin-top:2px}
.dlegend i{display:inline-block;width:12px;height:9px;vertical-align:-1px;margin:0 3px 0 6px;border:1.5px solid #2f6fb0}
.dlegend i.full{background:rgba(47,111,176,.25)}
.dlegend i.part{border-style:dashed;background:rgba(47,111,176,.07)}
.spin.sel{width:26px;height:26px;font-size:13px;background:#2b2a28;color:#fff;border-color:#fff}
.dist{display:inline-block;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 6px;margin:0 0 4px}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#e9e6df;overflow:hidden}
.list-btn{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:970;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
main.pop-open .list-btn{display:none}
/* 学校選択時：地図の下に周辺施設リスト */
.near{position:absolute;left:0;right:0;bottom:0;height:42%;z-index:940;background:var(--bg);border-top:1px solid var(--line);display:none;flex-direction:column;box-shadow:0 -4px 14px rgba(0,0,0,.08)}
main.split #map{bottom:42%}
main.split .near{display:flex}
main.split .pop{bottom:calc(42% + 8px);max-height:34%}
main.split .list-btn{bottom:calc(42% + 10px)}
.near-head{display:flex;align-items:center;gap:8px;padding:7px 8px 6px 14px;font-size:12px;border-bottom:1px solid var(--line)}
.near-head span{flex:1;min-width:0}
.near-head b{font-weight:700}
.near-close{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font:inherit;font-size:11px;padding:3px 9px;cursor:pointer;white-space:nowrap}
.near-list{overflow-y:auto;flex:1;padding:4px 10px calc(10px + env(safe-area-inset-bottom))}
.near-sec{font-size:10.5px;color:var(--muted);margin:8px 2px 2px;font-weight:700}
.nrow{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:6px 9px;margin:4px 0;font-family:inherit;color:inherit;cursor:pointer}
.nrow .sw{width:10px;height:10px;border-radius:50%;flex:0 0 auto}
.nrow .sw.sq{border-radius:2px}
.nrow .nm{font-size:12.5px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nrow .dd{font-size:10.5px;color:var(--muted);white-space:nowrap}
.ndetail{background:var(--surface);border:1.5px solid var(--ink);border-top:0;border-radius:0 0 10px 10px;margin:-6px 0 6px;padding:8px 10px;font-size:11px;line-height:1.5}
.ndetail .meta{color:var(--muted);margin:2px 0 3px;font-size:10.5px}
.ndetail .note{font-size:10.5px;background:color-mix(in srgb,var(--jihatsu) 14%,var(--surface));border-left:3px solid var(--jihatsu);border-radius:6px;padding:4px 7px;margin:4px 0}
.ndetail .summary{margin:3px 0 5px}
.ndetail .info{font-size:10.5px;color:var(--muted);margin:0 0 6px}
.ndetail .info a{color:inherit}
.nrow.on{border-radius:10px 10px 0 0;border-color:var(--ink);background:color-mix(in srgb,var(--ink) 6%,var(--surface))}
.stale{position:absolute;left:12px;right:12px;top:12px;z-index:980;background:#fff4d6;color:#5a4300;border:1px solid #e8c766;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}

/* markers */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:"Zen Maru Gothic",sans-serif;letter-spacing:-.5px}
.pin.clinic{border-radius:7px;transform:none;width:26px;height:26px}
.pin.clinic span{transform:none;font-size:12px}
.pin.lesson{border-radius:50%;transform:none;width:26px;height:26px;border:3px double #fff}
.pin.lesson span{transform:none;font-size:11.5px}
.pin.active{outline:3px solid var(--ink);outline-offset:1px}

/* compact popup card */
.pop{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:950;width:min(236px,64%);max-height:40%;overflow-y:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:11px;line-height:1.5;display:none}
.pop.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop-close{position:absolute;top:2px;right:2px;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:6px 7px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:0 22px 4px 0}
.badge{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px}
.pop .name{font-family:"Zen Maru Gothic",sans-serif;font-size:13px;font-weight:700;margin:0 20px 2px 0;line-height:1.35}
.pop .meta{color:var(--muted);margin:0 0 3px;font-size:10.5px}
.pop .note{font-size:10.5px;line-height:1.45;background:color-mix(in srgb,var(--jihatsu) 14%,var(--surface));border-left:3px solid var(--jihatsu);border-radius:6px;padding:4px 7px;margin:4px 0}
.pop .summary{margin:3px 0 5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pop .summary.full{-webkit-line-clamp:unset;display:block}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.cat{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--muted)}
.cat.les{border-color:var(--lesson);color:var(--lesson)}
.cat.hit{border-color:var(--ink);color:var(--ink);font-weight:700}
.pop .info{font-size:10.5px;color:var(--muted);margin:0 0 6px}
.pop .info a{color:inherit}
.actions{display:flex;gap:6px}
.pop .actions{position:sticky;bottom:-8px;background:var(--surface);margin:0 -10px -8px;padding:6px 10px 8px;border-top:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;font-family:inherit;white-space:nowrap}
.btn-primary{flex:1;background:var(--ink);color:var(--bg)}
.btn-sub{border:1.5px solid var(--line);color:var(--ink)}

/* list */
.list{position:absolute;inset:0;z-index:960;background:var(--bg);overflow-y:auto;padding:10px 16px 90px;display:none}
.list.open{display:block}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.list-head select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:4px 6px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:inherit;font-family:inherit}
.item .name{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;font-weight:700;margin:2px 0 2px}
.item p{margin:0 0 4px;font-size:12px;color:var(--muted);line-height:1.55}
.source{font-size:11px;color:var(--muted);line-height:1.7;margin-top:14px}
.source a{color:inherit}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>療育・習い事マップ<small id="area"></small></h1>
      <span class="count" id="count"></span>
    </div>
    <div class="seg" id="kindSeg" role="group" aria-label="表示する施設">
      <button data-k="ryo" aria-pressed="false"><span class="dot" style="background:var(--jihatsu)"></span>療育</button>
      <button data-k="les" aria-pressed="false"><span class="dot" style="background:var(--lesson)"></span>習い事</button>
      <button data-k="both" aria-pressed="true">両方</button>
    </div>
    <div class="chips" id="chips" role="group" aria-label="療育の種類で絞り込み"></div>
    <div class="selects">
      <div class="fbox ryo" id="catBox">療育の得意分野<select id="catSel" aria-label="療育の得意分野で絞り込み"></select></div>
      <div class="fbox les" id="genreBox">習い事のジャンル<select id="genreSel" aria-label="習い事のジャンルで絞り込み"></select></div>
    </div>
    <div class="selects school">
      <label>エリア<select id="wardSel" aria-label="エリアで絞り込み"></select></label>
      <label>学校から探す<select id="schoolSel" aria-label="学校から探す"></select></label>
    </div>
    <p class="school-note" id="schoolNote" hidden></p>
  </header>
  <main id="main">
    <div id="map" aria-label="施設の地図"></div>
    <button class="list-btn" id="listBtn">一覧で見る</button>
    <section class="list" id="list" aria-label="施設一覧"></section>
    <section class="near" id="near" aria-label="学校周辺の施設">
      <div class="near-head"><span id="nearTitle"></span><button class="near-close" id="nearClose">選択解除 ×</button></div>
      <div class="near-list" id="nearList"></div>
    </section>
    <section class="pop" id="pop" aria-live="polite">
      <button class="pop-close" id="popClose" aria-label="閉じる">×</button>
      <div id="popBody"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="facilities.js?v=20260926-6"></script>
<script>
(function(){
  const SERVICES = {
    jihatsu:{label:"児童発達支援", short:"児", color:"var(--jihatsu)"},
    houday:{label:"放課後等デイ", short:"放", color:"var(--houday)"},
    houmon:{label:"居宅訪問型", short:"訪", color:"var(--houmon)"},
    hoikuhoumon:{label:"保育所等訪問", short:"保", color:"var(--hoiku)"},
    clinic:{label:"医療機関", short:"医", color:"var(--clinic)"},
    lesson:{label:"習い事", short:"習", color:"var(--lesson)"}
  };
  // 習い事のジャンル（facilities.js の genre）
  const GENRES = { study:{label:"学習・英語", short:"学"}, art:{label:"音楽・アート", short:"音"}, sport:{label:"運動", short:"運"} };
  // 得意分野（facilities.js の cats に入れるキー）
  const CATS = {
    lang:"ことば・言語", motor:"運動", sensory:"感覚統合", study:"学習", sst:"SST・社会性",
    aba:"ABA（行動療法）", medcare:"医療的ケア・重心", career:"就労・キャリア", pickup:"送迎あり"
  };
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
  const meta = window.FACILITIES_META||{};
  const AREAS = meta.areas||[];
  const data = (window.FACILITIES||[]).map((f,i)=>({...f,id:i,cats:f.cats||[]}));

  if(!data.length || data.some(f=>!f.ward) || !AREAS.length){
    const w=document.createElement("div"); w.className="stale";
    w.textContent = !data.length
      ? "施設データ（facilities.js）を読み込めませんでした。index.html と同じ場所に facilities.js があるか確認してください。"
      : "古い施設データ（facilities.js）が読み込まれています。最新の facilities.js をアップロードし、ページを再読み込みしてください。";
    document.getElementById("main").appendChild(w);
  }
  document.getElementById("area").textContent = AREAS.map(a=>a.replace(/区$/,"")).join("・");

  // 同じ座標の施設を少しずらす
  const seen = {};
  data.forEach(f=>{
    const k=f.lat.toFixed(5)+","+f.lng.toFixed(5);
    const n=seen[k]=(seen[k]||0)+1;
    if(n>1){f.lat+=(n-1)*0.00018; f.lng+=(n-1)*0.00022;}
  });

  const isClinic = f => f.services.includes("clinic");
  const isLesson = f => f.services.includes("lesson");
  const main4 = f => { const m=f.services.filter(s=>s!=="hoikuhoumon"); return m.length?m:f.services; };
  const colorOf = f => { const k=main4(f); return k.length>1 ? "var(--both)" : SERVICES[k[0]].color; };
  const labelOf = f => isLesson(f) ? (GENRES[f.genre]||{short:"習"}).short : main4(f).slice(0,2).map(s=>SERVICES[s].short).join("");

  const map = L.map("map",{zoomControl:false}).setView([35.69,139.775],14);
  L.control.zoom({position:"topright"}).addTo(map);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{
    maxZoom:18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
  }).addTo(map);

  const markers = {};
  let active = null;
  data.forEach(f=>{
    const icon = L.divIcon({className:"",iconSize:[28,28],iconAnchor:isClinic(f)||isLesson(f)?[13,13]:[14,28],
      html:`<div class="pin${isClinic(f)?" clinic":isLesson(f)?" lesson":""}" style="background:${colorOf(f)}"><span>${labelOf(f)}</span></div>`});
    const m = L.marker([f.lat,f.lng],{icon,title:f.name,keyboard:true});
    m.on("click",()=>openPop(f));
    markers[f.id]=m;
  });

  // --- filters ---
  let kind="both", mode="all", ward="all", cat="all", genre="all", sortBy="ward";
  const chips=document.getElementById("chips");
  chips.innerHTML = `<span class="chips-label">療育の種類</span><button class="chip" data-k="all" aria-pressed="true">すべて</button>` +
    Object.entries(SERVICES).filter(([k])=>k!=="lesson").map(([k,s])=>`<button class="chip" data-k="${k}" aria-pressed="false"><span class="dot${k==="clinic"?" sq":""}" style="background:${s.color}"></span>${s.label}</button>`).join("");
  chips.addEventListener("click",e=>{
    const b=e.target.closest("button.chip"); if(!b) return;
    mode=b.dataset.k;
    chips.querySelectorAll("button.chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
    applyFilter();
  });
  const wardSel=document.getElementById("wardSel"), catSel=document.getElementById("catSel"), genreSel=document.getElementById("genreSel");
  const kindSeg=document.getElementById("kindSeg"), catBox=document.getElementById("catBox"), genreBox=document.getElementById("genreBox");
  // 表示する施設：療育／習い事／両方。関係のない絞り込みは隠す
  function setKind(k){
    kind=k;
    kindSeg.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.k===k)));
    chips.hidden = k==="les"; catBox.hidden = k==="les"; genreBox.hidden = k==="ryo";
    if(k==="les"){ mode="all"; cat="all"; catSel.value="all"; catSel.classList.remove("on"); chips.querySelectorAll("button.chip").forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.k==="all"))); }
    if(k==="ryo"){ genre="all"; genreSel.value="all"; genreSel.classList.remove("on"); }
    applyFilter();
    if(!school) fitVisible();
  }
  kindSeg.addEventListener("click",e=>{ const b=e.target.closest("button"); if(b) setKind(b.dataset.k); });
  wardSel.innerHTML = `<option value="all">すべて</option>`+AREAS.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  catSel.innerHTML = `<option value="all">すべて</option>`+Object.entries(CATS).map(([k,v])=>{
    const n=data.filter(f=>f.cats.includes(k)).length; return `<option value="${k}">${esc(v)}（${n}）</option>`;}).join("");
  genreSel.innerHTML = `<option value="all">すべて</option>`+Object.entries(GENRES).map(([k,v])=>{
    const n=data.filter(f=>isLesson(f)&&f.genre===k).length; return `<option value="${k}">${esc(v.label)}（${n}）</option>`;}).join("");
  genreSel.onchange=()=>{genre=genreSel.value; genreSel.classList.toggle("on",genre!=="all"); applyFilter();};
  wardSel.onchange=()=>{ward=wardSel.value; wardSel.classList.toggle("on",ward!=="all"); applyFilter(); fitVisible();};
  catSel.onchange=()=>{cat=catSel.value; catSel.classList.toggle("on",cat!=="all"); applyFilter();};

  // --- 学校から探す ---
  const SCHOOLS = window.SCHOOLS||[];
  const WALK_M = 1000;          // 直線1,000m ≒ 道のり1,200m ≒ 徒歩15分（80m/分）
  const walkMin = m => Math.max(1, Math.round(m*1.2/80));
  const distM = (a,b) => { const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
    const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
  let school=null, schoolCircle=null, districtLayers=[];
  const DIST=(window.SCHOOL_DISTRICTS||{}).dist||{}, DNOTE=(window.SCHOOL_DISTRICTS||{}).note||{}, CHOME=window.CHOME_POLYS||{};
  // Google polyline（精度1e-4）をデコード
  function decPoly(str){ let i=0,lat=0,lng=0; const pts=[];
    while(i<str.length){ for(let k=0;k<2;k++){ let sh=0,res=0,b; do{ b=str.charCodeAt(i++)-63; res|=(b&31)<<sh; sh+=5; }while(b>=32);
      const d=(res&1)?~(res>>1):(res>>1); if(k===0) lat+=d; else lng+=d; } pts.push([lat/1e4,lng/1e4]); }
    return pts; }
  const districtOf = s => DIST[s.ward+"|"+s.name];
  function drawDistrict(s){
    districtLayers.forEach(l=>l.remove()); districtLayers=[];
    const d=s&&districtOf(s); if(!d) return;
    d.forEach(([nm,part])=>{ (CHOME[nm]||[]).forEach(enc=>{
      const lay=L.polygon(decPoly(enc), part
        ? {color:"#2f6fb0",weight:1,dashArray:"3 3",fillColor:"#2f6fb0",fillOpacity:.07,interactive:false}
        : {color:"#2f6fb0",weight:1,fillColor:"#2f6fb0",fillOpacity:.22,interactive:false}).addTo(map);
      if(lay.bringToBack) lay.bringToBack();
      districtLayers.push(lay); }); });
  }
  function districtNote(s){
    if(s.kind==="private") return `<span class="dlegend">私立のため学区はありません</span>`;
    if(districtOf(s)) return `<span class="dlegend">学区：<i class="full"></i>全域<i class="part"></i>一部（番地で分かれる）</span>`;
    const n=DNOTE[s.ward+"|"+s.name]; return n?`<span class="dlegend">${esc(n)}</span>`:"";
  }
  const schoolSel=document.getElementById("schoolSel"), schoolNote=document.getElementById("schoolNote");
  const LV={e:"小学校",j:"中学校"};
  schoolSel.innerHTML = `<option value="">選択しない</option>` + AREAS.map(a=>
    [["e","public"],["j","public"],["e","private"],["j","private"]].map(([lv,kd])=>{const arr=SCHOOLS.map((s,i)=>({...s,i})).filter(s=>s.ward===a&&s.level===lv&&(s.kind||"public")===kd);
      return arr.length?`<optgroup label="${esc(a)}の${kd==="private"?"私立":"区立"}${LV[lv]}">`+arr.map(s=>`<option value="${s.i}">${esc(s.name)}</option>`).join("")+`</optgroup>`:"";}).join("")).join("");
  const schoolMarkers = SCHOOLS.map((s,i)=>{
    const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",iconSize:[18,18],iconAnchor:[9,9],html:`<div class="spin ${s.level}${s.kind==="private"?" p":""}">${s.level==="e"?"小":"中"}</div>`}),title:(s.kind==="private"?"私立 ":"")+s.name,zIndexOffset:-500});
    m.on("click",()=>{schoolSel.value=String(i); schoolSel.onchange();});
    return m.addTo(map);
  });
  schoolSel.onchange=()=>{
    const v=schoolSel.value;
    closePop();
    schoolMarkers.forEach((m,i)=>{ const el=m.getElement&&m.getElement(); if(el&&el.firstElementChild) el.firstElementChild.classList.toggle("sel", String(i)===v); });
    if(schoolCircle){ schoolCircle.remove(); schoolCircle=null; }
    drawDistrict(null);
    if(v===""){ school=null; schoolSel.classList.remove("on"); schoolNote.hidden=true; data.forEach(f=>f.dist=null); if(sortBy==="dist") sortBy="ward"; setSplit(false); applyFilter(); fitVisible(); return; }
    school=SCHOOLS[+v]; schoolSel.classList.add("on");
    data.forEach(f=>f.dist=distM(school,f));
    drawDistrict(school);   // 区立校は学区（通学区域）を塗る
    schoolCircle=L.circle([school.lat,school.lng],{radius:WALK_M,color:"#2b2a28",weight:1.5,dashArray:"5 5",fillOpacity:0,interactive:false}).addTo(map);
    sortBy="dist";
    setSplit(true);
    applyFilter();
    // 徒歩15分の円（半径1km）がちょうど収まり、学校が中心に来るように縮尺を合わせる
    const dLat=WALK_M/111320, dLng=WALK_M/(111320*Math.cos(school.lat*Math.PI/180));
    map.fitBounds(L.latLngBounds([[school.lat-dLat,school.lng-dLng],[school.lat+dLat,school.lng+dLng]]),{padding:[12,12],animate:false});
  };
  const visitOnly = f => f.services.every(x=>x==="houmon"||x==="hoikuhoumon");
  const preschoolOnly = f => f.services.length===1 && f.services[0]==="jihatsu";
  // 学校選択時：未就学児向け（児童発達支援のみ）は除外。訪問型は学校・自宅に来てくれるので距離に関係なく表示
  const nearOk = f => !school || (!preschoolOnly(f) && (visitOnly(f) || f.dist<=WALK_M || f.cats.includes("pickup")));
  // 療育の絞り込み（種類・得意分野）は療育の施設に、ジャンルは習い事にだけ効く
  const ryoOk = f => (mode==="all" || f.services.includes(mode)) && (cat==="all" || f.cats.includes(cat));
  const lesOk = f => genre==="all" || f.genre===genre;
  const kindOk = f => isLesson(f) ? (kind!=="ryo" && lesOk(f)) : (kind!=="les" && ryoOk(f));
  const visible = f => kindOk(f) && (ward==="all" || f.ward===ward) && nearOk(f);
  const distLabel = f => !school ? "" : visitOnly(f) ? "学校・自宅へ訪問" : (f.dist<=WALK_M ? `${esc(school.name)}から徒歩約${walkMin(f.dist)}分` : `送迎あり（${esc(school.name)}から約${(f.dist/1000).toFixed(1)}km）`);
  function applyFilter(){
    let n=0;
    data.forEach(f=>{ if(visible(f)){n++; markers[f.id].addTo(map);} else markers[f.id].remove(); });
    document.getElementById("count").textContent = `${n}件`;
    if(school) schoolNote.innerHTML=`<b>${esc(school.name)}</b>から徒歩15分以内（点線の円）か送迎あり、または訪問型：<b>${n}件</b>（未就学児向けのみの施設は除外）`;
    const ln=data.filter(f=>visible(f)&&isLesson(f)).length;
    document.getElementById("count").textContent = kind==="both" ? `療育${n-ln}／習い事${ln}` : `${n}件`;
    renderList(); renderNear();
    if(active && !visible(active)) closePop();
  }
  const nearEl=document.getElementById("near"), nearList=document.getElementById("nearList"), nearTitle=document.getElementById("nearTitle");
  function setSplit(on){
    document.getElementById("main").classList.toggle("split",on);
    if(map.invalidateSize) map.invalidateSize({pan:false});
  }
  function renderNear(){
    if(!school){ nearList.innerHTML=""; return; }
    let vis=data.filter(visible); const all=vis.length;
    const les=vis.filter(isLesson).sort((a,b)=>a.dist-b.dist);
    vis=vis.filter(f=>!isLesson(f));
    const walk=vis.filter(f=>!visitOnly(f)&&f.dist<=WALK_M).sort((a,b)=>a.dist-b.dist);
    const pick=vis.filter(f=>!visitOnly(f)&&f.dist>WALK_M).sort((a,b)=>a.dist-b.dist);
    const visit=vis.filter(visitOnly);
    nearTitle.innerHTML=`<b>${esc(school.name)}</b>から徒歩15分・送迎あり・訪問型：<b>${all}件</b>${districtNote(school)}`;
    const row=f=>`<button class="nrow${active&&active.id===f.id?" on":""}" data-id="${f.id}"><span class="sw${isClinic(f)?" sq":""}" style="background:${colorOf(f)}"></span><span class="nm">${esc(f.name)}</span><span class="dd">${visitOnly(f)?"訪問型":f.dist<=WALK_M?"徒歩約"+walkMin(f.dist)+"分":"送迎あり・"+(f.dist/1000).toFixed(1)+"km"}</span></button>`;
    const sec=(t,a)=>a.length?`<p class="near-sec">${t}（${a.length}）</p>`+a.map(row).join(""):"";
    nearList.innerHTML = all ? sec("療育：徒歩15分以内",walk)+sec("療育：送迎あり（徒歩15分より遠い）",pick)+sec("療育：学校・自宅へ訪問",visit)+sec("習い事：徒歩15分以内",les)
      : `<p class="near-sec">条件に合う施設がありません。種類・得意分野・ジャンルの絞り込みを「すべて」に戻すか、表示を「両方」にしてみてください。</p>`;
  }
  nearList.addEventListener("click",e=>{
    const b=e.target.closest(".nrow"); if(!b) return;
    const f=data[+b.dataset.id];
    if(active && active.id===f.id){ closePop(); return; }
    openPop(f);   // 縮尺はそのまま、ピンの位置だけ合わせる
  });
  document.getElementById("nearClose").onclick=()=>{ schoolSel.value=""; schoolSel.onchange(); };
  function fitVisible(){
    const pts=data.filter(visible).map(f=>[f.lat,f.lng]);
    if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:16});
  }

  // --- compact popup ---
  const pop=document.getElementById("pop"), body=document.getElementById("popBody"), mainEl=document.getElementById("main");
  const badges = f => isLesson(f)
    ? `<span class="badge" style="background:var(--lesson)">習い事・${esc((GENRES[f.genre]||{label:""}).label)}</span>`
    : f.services.map(s=>`<span class="badge" style="background:${SERVICES[s].color}">${SERVICES[s].label}</span>`).join("");
  const catTags = f => isLesson(f)
    ? (f.tags||[]).map(t=>`<span class="cat les">${esc(t)}</span>`).join("")
    : f.cats.map(c=>`<span class="cat${c===cat?" hit":""}">${esc(CATS[c]||c)}</span>`).join("");
  const hasTags = f => isLesson(f) ? (f.tags||[]).length>0 : f.cats.length>0;
  function detailHTML(f, inline){
    const q=encodeURIComponent(f.name+" "+f.address.replace(/（.*?）/g,""));
    const tel=(f.tel||"").replace(/[^0-9]/g,"");
    return `
      ${inline?"":`<div class="badges">${badges(f)}</div>
      <h2 class="name">${esc(f.name)}</h2>
      ${school?`<span class="dist">${distLabel(f)}</span>`:""}`}
      ${inline?`<div class="badges">${badges(f)}</div>`:""}
      <p class="meta">${esc(f.ward||"")}${f.age?"・対象："+esc(f.age):""}</p>
      ${f.note?`<p class="note">⚠ ${esc(f.note)}</p>`:""}
      <p class="summary${inline?" full":""}" title="タップで全文">${esc(f.summary)}</p>
      ${hasTags(f)?`<div class="cats">${catTags(f)}</div>`:""}
      <p class="info">📍 ${esc(f.address)}${f.tel?`<br>📞 <a href="tel:${tel}">${esc(f.tel)}</a>`:""}</p>
      <div class="actions">
        <a class="btn btn-primary" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">公式サイト ↗</a>
        <a class="btn btn-sub" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">経路</a>
      </div>`;
  }
  // 学校選択中（地図＋下のリスト表示）は、ポップアップの代わりにリスト内で詳細を開く
  function openInline(f){
    nearList.querySelectorAll(".ndetail").forEach(d=>d.remove());
    const row=nearList.querySelector(`.nrow[data-id="${f.id}"]`);
    if(row){
      const d=document.createElement("div"); d.className="ndetail pop-like"; d.innerHTML=detailHTML(f,true);
      row.after(d);
      row.scrollIntoView({block:"nearest",behavior:"smooth"});
      d.querySelector(".summary").onclick=e=>e.currentTarget.classList.toggle("full");
    }
    map.panTo([f.lat,f.lng],{animate:true});   // 縮尺は変えずに中心だけ移動
  }
  function openPop(f){
    if(active) markers[active.id].getElement()?.firstElementChild?.classList.remove("active");
    active=f;
    markers[f.id].getElement()?.firstElementChild?.classList.add("active");
    nearList.querySelectorAll(".nrow").forEach(r=>r.classList.toggle("on", +r.dataset.id===f.id));
    if(mainEl.classList.contains("split")){ openInline(f); return; }
    body.innerHTML = detailHTML(f);
    body.querySelector(".summary").onclick=e=>e.currentTarget.classList.toggle("full");
    pop.classList.add("open"); mainEl.classList.add("pop-open");
    pop.scrollTop=0;
    // ピンがカードに隠れないよう、カードの右上あたりに来るようずらす
    const pt=map.latLngToContainerPoint([f.lat,f.lng]);
    const r=pop.getBoundingClientRect(), sz=map.getSize();
    const tx=Math.min(sz.x-40, r.width+ (sz.x-r.width)/2), ty=Math.max(60,(sz.y-r.height)/2);
    map.panBy([pt.x-tx, pt.y-ty],{animate:true});
  }
  function closePop(){
    pop.classList.remove("open"); mainEl.classList.remove("pop-open");
    if(active) markers[active.id].getElement()?.firstElementChild?.classList.remove("active");
    nearList.querySelectorAll(".nrow.on").forEach(r=>r.classList.remove("on"));
    nearList.querySelectorAll(".ndetail").forEach(d=>d.remove());
    active=null;
  }
  document.getElementById("popClose").onclick=closePop;
  map.on("click",closePop);

  // --- list ---
  const list=document.getElementById("list"), listBtn=document.getElementById("listBtn");
  const collator=new Intl.Collator("ja");
  function sorted(arr){
    const a=[...arr];
    if(sortBy==="dist" && school) a.sort((x,y)=>x.dist-y.dist);
    else if(sortBy==="name") a.sort((x,y)=>collator.compare(x.name,y.name));
    else if(sortBy==="type"){ const O=Object.keys(SERVICES); const r=f=>{const k=main4(f); return k.length>1?0.5:O.indexOf(k[0]);}; a.sort((x,y)=>r(x)-r(y) || AREAS.indexOf(x.ward)-AREAS.indexOf(y.ward) || x.id-y.id); }
    else if(sortBy==="cats") a.sort((x,y)=>y.cats.length-x.cats.length || collator.compare(x.name,y.name));
    else a.sort((x,y)=>AREAS.indexOf(x.ward)-AREAS.indexOf(y.ward) || x.id-y.id);
    return a;
  }
  function renderList(){
    const items=sorted(data.filter(visible));
    list.innerHTML = `<div class="list-head"><span>${items.length}件${cat!=="all"?"・得意分野「"+esc(CATS[cat])+"」":""}${genre!=="all"?"・ジャンル「"+esc(GENRES[genre].label)+"」":""}</span>
      <select id="sortSel" aria-label="並べ替え">
        <option value="ward">区ごと</option><option value="type">種類ごと</option>
        ${school?`<option value="dist">学校から近い順</option>`:""}<option value="name">名前順</option><option value="cats">得意分野が多い順</option>
      </select></div>` +
      items.map(f=>`
      <button class="item" data-id="${f.id}">
        <div class="badges">${badges(f)}</div>
        <div class="name">${esc(f.name)}</div>
        ${school?`<span class="dist">${distLabel(f)}</span>`:""}
        <p>${esc(f.ward||"")}${f.age?"・"+esc(f.age):""}</p>
        <p>${esc(f.summary)}</p>
        ${hasTags(f)?`<div class="cats">${catTags(f)}</div>`:""}
      </button>`).join("") +
      `<p class="source">掲載情報は各区の公式一覧（${(meta.sources||[]).map(s=>s.url?`<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a>`:esc(s.name)).join("、")}）と各施設・医療機関の公式サイトをもとに作成しています（最終確認 ${esc(meta.updated)}）。得意分野は公式サイトの記載からの分類です。「送迎あり」は公式サイトまたは療育施設検索サイト「イクデン」の送迎あり一覧に掲載の施設で、送迎の範囲・対象校は施設ごとに異なります。徒歩時間は直線距離×1.2を分速80mで割った目安です。学校は各区の区立小・中学校と3区内の私立小・中学校（座標はOpenStreetMap）です。習い事は、発達障害・グレーゾーンの子の受け入れや個別対応・少人数制など、発達特性への配慮を公式サイトに明記している教室だけを掲載しています（福祉サービスではない自費の教室・区の事業）。学区は各区公式の通学区域表をもとに町丁目単位で表示しており、番地で分かれる町丁目は点線（一部）で示しています。正確な学区は各区の教育委員会にご確認ください。閉室・移転・空き状況・予約状況は変わることがあります。利用・受診前に必ず直接ご確認ください。</p>`;
    const ss=document.getElementById("sortSel"); ss.value=sortBy;
    ss.onchange=()=>{sortBy=ss.value; renderList();};
  }
  list.addEventListener("click",e=>{
    const b=e.target.closest(".item"); if(!b) return;
    toggleList(false);
    const f=data[+b.dataset.id];
    map.setView([f.lat,f.lng],map.getZoom(),{animate:false});   // 縮尺は変えない
    openPop(f);
  });
  function toggleList(show){
    list.classList.toggle("open",show);
    listBtn.textContent = show ? "地図で見る" : "一覧で見る";
    if(show){ closePop(); list.scrollTop=0; }
  }
  listBtn.onclick=()=>toggleList(!list.classList.contains("open"));

  applyFilter();
  if(data.length) map.fitBounds(L.latLngBounds(data.map(f=>[f.lat,f.lng])),{padding:[30,30]});
})();
</script>
</body>
</html>
