<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>療育マップ 千代田・台東・中央</title>
<meta name="description" content="千代田区・台東区・中央区の児童発達支援・放課後等デイサービスと、子どもの発達障害を診る医療機関を地図で探せるマップ。">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fbf8f3; --surface:#ffffff; --ink:#2b2a28; --muted:#6f6a62; --line:#e7e1d7;
  --jihatsu:#e8833a; --houday:#2f7fc1; --both:#8a5cc2; --houmon:#3a9a6a; --hoiku:#c2527a; --clinic:#d64545;
  --shadow:0 8px 24px rgba(40,30,10,.22);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1b1a18; --surface:#262522; --ink:#f1ede6; --muted:#aaa397; --line:#3a3833;
    --shadow:0 8px 24px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans JP",system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
.app{display:flex;flex-direction:column;height:100dvh}
header{padding:10px 16px 8px;background:var(--bg);border-bottom:1px solid var(--line);z-index:1000}
.title-row{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h1{font-family:"Zen Maru Gothic",sans-serif;font-size:19px;margin:0;letter-spacing:.02em}
h1 small{font-size:12px;color:var(--muted);margin-left:6px;font-weight:500}
.count{font-size:12px;color:var(--muted);white-space:nowrap}
.chips{display:flex;gap:6px;margin-top:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:5px 11px;font-size:12.5px;font-weight:500;cursor:pointer;display:flex;align-items:center;gap:5px;font-family:inherit}
.chip .dot{width:9px;height:9px;border-radius:50%}
.chip .dot.sq{border-radius:2px}
.chip[aria-pressed="true"]{border-color:var(--ink);background:var(--ink);color:var(--bg)}
.selects{display:flex;gap:6px;margin-top:6px}
.selects label{flex:1;min-width:0;display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)}
.selects select{flex:1;min-width:0;font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:5px 6px}
.selects select.on{border-color:var(--ink)}
.selects.school{margin-top:5px}
.selects.school label{flex:1}
.school-note{font-size:10.5px;color:var(--muted);margin:4px 0 0;line-height:1.45}
.school-note b{color:var(--ink)}
.spin{width:18px;height:18px;border-radius:5px;background:#fff;border:2px solid #555;color:#333;font-size:10px;font-weight:700;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(0,0,0,.3);font-family:"Zen Maru Gothic",sans-serif}
.spin.j{border-color:#7a6a55}
.spin.sel{width:26px;height:26px;font-size:13px;background:#2b2a28;color:#fff;border-color:#fff}
.dist{display:inline-block;font-size:10.5px;font-weight:700;background:var(--ink);color:var(--bg);border-radius:5px;padding:1px 6px;margin:0 0 4px}
main{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#e9e6df;overflow:hidden}
.list-btn{position:absolute;right:12px;bottom:calc(16px + env(safe-area-inset-bottom));z-index:970;background:var(--ink);color:var(--bg);border:0;border-radius:999px;padding:10px 16px;font-size:13px;font-weight:700;box-shadow:var(--shadow);cursor:pointer;font-family:inherit}
main.pop-open .list-btn{display:none}
.stale{position:absolute;left:12px;right:12px;top:12px;z-index:980;background:#fff4d6;color:#5a4300;border:1px solid #e8c766;border-radius:12px;padding:10px 12px;font-size:13px;line-height:1.6;box-shadow:var(--shadow)}

/* markers */
.pin{width:28px;height:28px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:2.5px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.35);display:flex;align-items:center;justify-content:center}
.pin span{transform:rotate(45deg);color:#fff;font-size:11px;font-weight:700;font-family:"Zen Maru Gothic",sans-serif;letter-spacing:-.5px}
.pin.clinic{border-radius:7px;transform:none;width:26px;height:26px}
.pin.clinic span{transform:none;font-size:12px}
.pin.active{outline:3px solid var(--ink);outline-offset:1px}

/* compact popup card */
.pop{position:absolute;left:8px;bottom:calc(8px + env(safe-area-inset-bottom));z-index:950;width:min(236px,64%);max-height:40%;overflow-y:auto;background:var(--surface);border-radius:12px;box-shadow:var(--shadow);padding:8px 10px;font-size:11px;line-height:1.5;display:none}
.pop.open{display:block;animation:pop .18s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.pop-close{position:absolute;top:2px;right:2px;border:0;background:transparent;color:var(--muted);font-size:16px;line-height:1;cursor:pointer;padding:6px 7px}
.badges{display:flex;flex-wrap:wrap;gap:4px;margin:0 22px 4px 0}
.badge{font-size:9.5px;font-weight:700;color:#fff;border-radius:4px;padding:1px 5px}
.pop .name{font-family:"Zen Maru Gothic",sans-serif;font-size:13px;font-weight:700;margin:0 20px 2px 0;line-height:1.35}
.pop .meta{color:var(--muted);margin:0 0 3px;font-size:10.5px}
.pop .note{font-size:10.5px;line-height:1.45;background:color-mix(in srgb,var(--jihatsu) 14%,var(--surface));border-left:3px solid var(--jihatsu);border-radius:6px;padding:4px 7px;margin:4px 0}
.pop .summary{margin:3px 0 5px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer}
.pop .summary.full{-webkit-line-clamp:unset;display:block}
.cats{display:flex;flex-wrap:wrap;gap:4px;margin:0 0 6px}
.cat{font-size:10px;border:1px solid var(--line);border-radius:999px;padding:0 6px;color:var(--muted)}
.cat.hit{border-color:var(--ink);color:var(--ink);font-weight:700}
.pop .info{font-size:10.5px;color:var(--muted);margin:0 0 6px}
.pop .info a{color:inherit}
.actions{display:flex;gap:6px}
.pop .actions{position:sticky;bottom:-8px;background:var(--surface);margin:0 -10px -8px;padding:6px 10px 8px;border-top:1px solid var(--line)}
.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;border-radius:8px;padding:6px 9px;font-size:11.5px;font-weight:700;font-family:inherit;white-space:nowrap}
.btn-primary{flex:1;background:var(--ink);color:var(--bg)}
.btn-sub{border:1.5px solid var(--line);color:var(--ink)}

/* list */
.list{position:absolute;inset:0;z-index:960;background:var(--bg);overflow-y:auto;padding:10px 16px 90px;display:none}
.list.open{display:block}
.list-head{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px;font-size:12px;color:var(--muted)}
.list-head select{font:inherit;font-size:12.5px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:4px 6px}
.item{display:block;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer;color:inherit;font-family:inherit}
.item .name{font-family:"Zen Maru Gothic",sans-serif;font-size:15px;font-weight:700;margin:2px 0 2px}
.item p{margin:0 0 4px;font-size:12px;color:var(--muted);line-height:1.55}
.source{font-size:11px;color:var(--muted);line-height:1.7;margin-top:14px}
.source a{color:inherit}
.leaflet-control-attribution{font-size:10px}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>療育マップ<small id="area"></small></h1>
      <span class="count" id="count"></span>
    </div>
    <div class="chips" id="chips" role="group" aria-label="種類で絞り込み"></div>
    <div class="selects">
      <label>エリア<select id="wardSel" aria-label="エリアで絞り込み"></select></label>
      <label>得意分野<select id="catSel" aria-label="得意分野で絞り込み"></select></label>
    </div>
    <div class="selects school">
      <label>学校から探す<select id="schoolSel" aria-label="学校から探す"></select></label>
    </div>
    <p class="school-note" id="schoolNote" hidden></p>
  </header>
  <main id="main">
    <div id="map" aria-label="施設の地図"></div>
    <button class="list-btn" id="listBtn">一覧で見る</button>
    <section class="list" id="list" aria-label="施設一覧"></section>
    <section class="pop" id="pop" aria-live="polite">
      <button class="pop-close" id="popClose" aria-label="閉じる">×</button>
      <div id="popBody"></div>
    </section>
  </main>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="facilities.js?v=20260926-2"></script>
<script>
(function(){
  const SERVICES = {
    jihatsu:{label:"児童発達支援", short:"児", color:"var(--jihatsu)"},
    houday:{label:"放課後等デイ", short:"放", color:"var(--houday)"},
    houmon:{label:"居宅訪問型", short:"訪", color:"var(--houmon)"},
    hoikuhoumon:{label:"保育所等訪問", short:"保", color:"var(--hoiku)"},
    clinic:{label:"医療機関", short:"医", color:"var(--clinic)"}
  };
  // 得意分野（facilities.js の cats に入れるキー）
  const CATS = {
    lang:"ことば・言語", motor:"運動", sensory:"感覚統合", study:"学習", sst:"SST・社会性",
    aba:"ABA（行動療法）", medcare:"医療的ケア・重心", career:"就労・キャリア", pickup:"送迎あり"
  };
  const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const safeUrl = u => /^https?:\/\//i.test(u||"") ? u : "#";
  const meta = window.FACILITIES_META||{};
  const AREAS = meta.areas||[];
  const data = (window.FACILITIES||[]).map((f,i)=>({...f,id:i,cats:f.cats||[]}));

  if(!data.length || data.some(f=>!f.ward) || !AREAS.length){
    const w=document.createElement("div"); w.className="stale";
    w.textContent = !data.length
      ? "施設データ（facilities.js）を読み込めませんでした。index.html と同じ場所に facilities.js があるか確認してください。"
      : "古い施設データ（facilities.js）が読み込まれています。最新の facilities.js をアップロードし、ページを再読み込みしてください。";
    document.getElementById("main").appendChild(w);
  }
  document.getElementById("area").textContent = AREAS.map(a=>a.replace(/区$/,"")).join("・");

  // 同じ座標の施設を少しずらす
  const seen = {};
  data.forEach(f=>{
    const k=f.lat.toFixed(5)+","+f.lng.toFixed(5);
    const n=seen[k]=(seen[k]||0)+1;
    if(n>1){f.lat+=(n-1)*0.00018; f.lng+=(n-1)*0.00022;}
  });

  const isClinic = f => f.services.includes("clinic");
  const main4 = f => { const m=f.services.filter(s=>s!=="hoikuhoumon"); return m.length?m:f.services; };
  const colorOf = f => { const k=main4(f); return k.length>1 ? "var(--both)" : SERVICES[k[0]].color; };
  const labelOf = f => main4(f).slice(0,2).map(s=>SERVICES[s].short).join("");

  const map = L.map("map",{zoomControl:false}).setView([35.69,139.775],14);
  L.control.zoom({position:"topright"}).addTo(map);
  L.tileLayer("https://cyberjapandata.gsi.go.jp/xyz/pale/{z}/{x}/{y}.png",{
    maxZoom:18, attribution:'<a href="https://maps.gsi.go.jp/development/ichiran.html" target="_blank" rel="noopener">国土地理院</a>'
  }).addTo(map);

  const markers = {};
  let active = null;
  data.forEach(f=>{
    const icon = L.divIcon({className:"",iconSize:[28,28],iconAnchor:isClinic(f)?[13,13]:[14,28],
      html:`<div class="pin${isClinic(f)?" clinic":""}" style="background:${colorOf(f)}"><span>${labelOf(f)}</span></div>`});
    const m = L.marker([f.lat,f.lng],{icon,title:f.name,keyboard:true});
    m.on("click",()=>openPop(f));
    markers[f.id]=m;
  });

  // --- filters ---
  let mode="all", ward="all", cat="all", sortBy="ward";
  const chips=document.getElementById("chips");
  chips.innerHTML = `<button class="chip" data-k="all" aria-pressed="true">すべて</button>` +
    Object.entries(SERVICES).map(([k,s])=>`<button class="chip" data-k="${k}" aria-pressed="false"><span class="dot${k==="clinic"?" sq":""}" style="background:${s.color}"></span>${s.label}</button>`).join("");
  chips.addEventListener("click",e=>{
    const b=e.target.closest("button.chip"); if(!b) return;
    mode=b.dataset.k;
    chips.querySelectorAll("button.chip").forEach(c=>c.setAttribute("aria-pressed",String(c===b)));
    applyFilter();
  });
  const wardSel=document.getElementById("wardSel"), catSel=document.getElementById("catSel");
  wardSel.innerHTML = `<option value="all">すべて</option>`+AREAS.map(a=>`<option value="${esc(a)}">${esc(a)}</option>`).join("");
  catSel.innerHTML = `<option value="all">すべて</option>`+Object.entries(CATS).map(([k,v])=>{
    const n=data.filter(f=>f.cats.includes(k)).length; return `<option value="${k}">${esc(v)}（${n}）</option>`;}).join("");
  wardSel.onchange=()=>{ward=wardSel.value; wardSel.classList.toggle("on",ward!=="all"); applyFilter(); fitVisible();};
  catSel.onchange=()=>{cat=catSel.value; catSel.classList.toggle("on",cat!=="all"); applyFilter();};

  // --- 学校から探す ---
  const SCHOOLS = window.SCHOOLS||[];
  const WALK_M = 1000;          // 直線1,000m ≒ 道のり1,200m ≒ 徒歩15分（80m/分）
  const walkMin = m => Math.max(1, Math.round(m*1.2/80));
  const distM = (a,b) => { const R=6371000, r=Math.PI/180, dLat=(b.lat-a.lat)*r, dLng=(b.lng-a.lng)*r;
    const h=Math.sin(dLat/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dLng/2)**2; return 2*R*Math.asin(Math.sqrt(h)); };
  let school=null, schoolCircle=null;
  const schoolSel=document.getElementById("schoolSel"), schoolNote=document.getElementById("schoolNote");
  schoolSel.innerHTML = `<option value="">選択しない</option>` + AREAS.map(a=>
    ["e","j"].map(lv=>{const arr=SCHOOLS.map((s,i)=>({...s,i})).filter(s=>s.ward===a&&s.level===lv);
      return arr.length?`<optgroup label="${esc(a)}の${lv==="e"?"小学校":"中学校"}">`+arr.map(s=>`<option value="${s.i}">${esc(s.name)}</option>`).join("")+`</optgroup>`:"";}).join("")).join("");
  const schoolMarkers = SCHOOLS.map((s,i)=>{
    const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:"",iconSize:[18,18],iconAnchor:[9,9],html:`<div class="spin ${s.level}">${s.level==="e"?"小":"中"}</div>`}),title:s.name,zIndexOffset:-500});
    m.on("click",()=>{schoolSel.value=String(i); schoolSel.onchange();});
    return m.addTo(map);
  });
  schoolSel.onchange=()=>{
    const v=schoolSel.value;
    schoolMarkers.forEach((m,i)=>{ const el=m.getElement&&m.getElement(); if(el&&el.firstElementChild) el.firstElementChild.classList.toggle("sel", String(i)===v); });
    if(schoolCircle){ schoolCircle.remove(); schoolCircle=null; }
    if(v===""){ school=null; schoolSel.classList.remove("on"); schoolNote.hidden=true; data.forEach(f=>f.dist=null); if(sortBy==="dist") sortBy="ward"; applyFilter(); fitVisible(); return; }
    school=SCHOOLS[+v]; schoolSel.classList.add("on");
    data.forEach(f=>f.dist=distM(school,f));
    schoolCircle=L.circle([school.lat,school.lng],{radius:WALK_M,color:"#2b2a28",weight:1.5,dashArray:"5 5",fillOpacity:.05}).addTo(map);
    sortBy="dist";
    applyFilter();
    schoolNote.hidden=false;
    const pts=data.filter(visible).map(f=>[f.lat,f.lng]).concat([[school.lat,school.lng]]);
    map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:16});
  };
  const visitOnly = f => f.services.every(x=>x==="houmon"||x==="hoikuhoumon");
  const preschoolOnly = f => f.services.length===1 && f.services[0]==="jihatsu";
  // 学校選択時：未就学児向け（児童発達支援のみ）は除外。訪問型は学校・自宅に来てくれるので距離に関係なく表示
  const nearOk = f => !school || (!preschoolOnly(f) && (visitOnly(f) || f.dist<=WALK_M || f.cats.includes("pickup")));
  const visible = f => (mode==="all" || f.services.includes(mode)) && (ward==="all" || f.ward===ward) && (cat==="all" || f.cats.includes(cat)) && nearOk(f);
  const distLabel = f => !school ? "" : visitOnly(f) ? "学校・自宅へ訪問" : (f.dist<=WALK_M ? `${esc(school.name)}から徒歩約${walkMin(f.dist)}分` : `送迎あり（${esc(school.name)}から約${(f.dist/1000).toFixed(1)}km）`);
  function applyFilter(){
    let n=0;
    data.forEach(f=>{ if(visible(f)){n++; markers[f.id].addTo(map);} else markers[f.id].remove(); });
    document.getElementById("count").textContent = `${n}件`;
    if(school) schoolNote.innerHTML=`<b>${esc(school.name)}</b>から徒歩15分以内（点線の円）か送迎あり、または訪問型：<b>${n}件</b>（未就学児向けのみの施設は除外）`;
    renderList();
    if(active && !visible(active)) closePop();
  }
  function fitVisible(){
    const pts=data.filter(visible).map(f=>[f.lat,f.lng]);
    if(pts.length) map.fitBounds(L.latLngBounds(pts),{padding:[30,30],maxZoom:16});
  }

  // --- compact popup ---
  const pop=document.getElementById("pop"), body=document.getElementById("popBody"), mainEl=document.getElementById("main");
  const badges = f => f.services.map(s=>`<span class="badge" style="background:${SERVICES[s].color}">${SERVICES[s].label}</span>`).join("");
  const catTags = f => f.cats.map(c=>`<span class="cat${c===cat?" hit":""}">${esc(CATS[c]||c)}</span>`).join("");
  function openPop(f){
    if(active) markers[active.id].getElement()?.firstElementChild?.classList.remove("active");
    active=f;
    markers[f.id].getElement()?.firstElementChild?.classList.add("active");
    const q=encodeURIComponent(f.name+" "+f.address.replace(/（.*?）/g,""));
    const tel=(f.tel||"").replace(/[^0-9]/g,"");
    body.innerHTML = `
      <div class="badges">${badges(f)}</div>
      <h2 class="name">${esc(f.name)}</h2>
      ${school?`<span class="dist">${distLabel(f)}</span>`:""}
      <p class="meta">${esc(f.ward||"")}${f.age?"・対象："+esc(f.age):""}</p>
      ${f.note?`<p class="note">⚠ ${esc(f.note)}</p>`:""}
      <p class="summary" title="タップで全文">${esc(f.summary)}</p>
      ${f.cats.length?`<div class="cats">${catTags(f)}</div>`:""}
      <p class="info">📍 ${esc(f.address)}${f.tel?`<br>📞 <a href="tel:${tel}">${esc(f.tel)}</a>`:""}</p>
      <div class="actions">
        <a class="btn btn-primary" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener">公式サイト ↗</a>
        <a class="btn btn-sub" href="https://www.google.com/maps/search/?api=1&query=${q}" target="_blank" rel="noopener">経路</a>
      </div>`;
    body.querySelector(".summary").onclick=e=>e.currentTarget.classList.toggle("full");
    pop.classList.add("open"); mainEl.classList.add("pop-open");
    pop.scrollTop=0;
    // ピンがカードに隠れないよう、カードの右上あたりに来るようずらす
    const pt=map.latLngToContainerPoint([f.lat,f.lng]);
    const r=pop.getBoundingClientRect(), sz=map.getSize();
    const tx=Math.min(sz.x-40, r.width+ (sz.x-r.width)/2), ty=Math.max(60,(sz.y-r.height)/2);
    map.panBy([pt.x-tx, pt.y-ty],{animate:true});
  }
  function closePop(){
    pop.classList.remove("open"); mainEl.classList.remove("pop-open");
    if(active) markers[active.id].getElement()?.firstElementChild?.classList.remove("active");
    active=null;
  }
  document.getElementById("popClose").onclick=closePop;
  map.on("click",closePop);

  // --- list ---
  const list=document.getElementById("list"), listBtn=document.getElementById("listBtn");
  const collator=new Intl.Collator("ja");
  function sorted(arr){
    const a=[...arr];
    if(sortBy==="dist" && school) a.sort((x,y)=>x.dist-y.dist);
    else if(sortBy==="name") a.sort((x,y)=>collator.compare(x.name,y.name));
    else if(sortBy==="type"){ const O=Object.keys(SERVICES); const r=f=>{const k=main4(f); return k.length>1?0.5:O.indexOf(k[0]);}; a.sort((x,y)=>r(x)-r(y) || AREAS.indexOf(x.ward)-AREAS.indexOf(y.ward) || x.id-y.id); }
    else if(sortBy==="cats") a.sort((x,y)=>y.cats.length-x.cats.length || collator.compare(x.name,y.name));
    else a.sort((x,y)=>AREAS.indexOf(x.ward)-AREAS.indexOf(y.ward) || x.id-y.id);
    return a;
  }
  function renderList(){
    const items=sorted(data.filter(visible));
    list.innerHTML = `<div class="list-head"><span>${items.length}件${cat!=="all"?"・得意分野「"+esc(CATS[cat])+"」":""}</span>
      <select id="sortSel" aria-label="並べ替え">
        <option value="ward">区ごと</option><option value="type">種類ごと</option>
        ${school?`<option value="dist">学校から近い順</option>`:""}<option value="name">名前順</option><option value="cats">得意分野が多い順</option>
      </select></div>` +
      items.map(f=>`
      <button class="item" data-id="${f.id}">
        <div class="badges">${badges(f)}</div>
        <div class="name">${esc(f.name)}</div>
        ${school?`<span class="dist">${distLabel(f)}</span>`:""}
        <p>${esc(f.ward||"")}${f.age?"・"+esc(f.age):""}</p>
        <p>${esc(f.summary)}</p>
        ${f.cats.length?`<div class="cats">${catTags(f)}</div>`:""}
      </button>`).join("") +
      `<p class="source">掲載情報は各区の公式一覧（${(meta.sources||[]).map(s=>`<a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.name)}</a>`).join("、")}）と各施設・医療機関の公式サイトをもとに作成しています（最終確認 ${esc(meta.updated)}）。得意分野は公式サイトの記載からの分類です。「送迎あり」は公式サイトまたは療育施設検索サイト「イクデン」の送迎あり一覧に掲載の施設で、送迎の範囲・対象校は施設ごとに異なります。徒歩時間は直線距離×1.2を分速80mで割った目安です。学校は各区の区立小・中学校（座標はOpenStreetMap）です。閉室・移転・空き状況・予約状況は変わることがあります。利用・受診前に必ず直接ご確認ください。</p>`;
    const ss=document.getElementById("sortSel"); ss.value=sortBy;
    ss.onchange=()=>{sortBy=ss.value; renderList();};
  }
  list.addEventListener("click",e=>{
    const b=e.target.closest(".item"); if(!b) return;
    toggleList(false);
    const f=data[+b.dataset.id];
    map.setView([f.lat,f.lng],16,{animate:false});
    openPop(f);
  });
  function toggleList(show){
    list.classList.toggle("open",show);
    listBtn.textContent = show ? "地図で見る" : "一覧で見る";
    if(show){ closePop(); list.scrollTop=0; }
  }
  listBtn.onclick=()=>toggleList(!list.classList.contains("open"));

  applyFilter();
  if(data.length) map.fitBounds(L.latLngBounds(data.map(f=>[f.lat,f.lng])),{padding:[30,30]});
})();
</script>
</body>
</html>
